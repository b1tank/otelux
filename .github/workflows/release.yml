name: Release

# Linux release pipeline. Changing the desktop version on `main`, pushing a
# matching version tag, or manually dispatching a version builds the Debian
# package, runs the packaged smoke test, produces checksums and an SBOM,
# attests build provenance, and publishes a GitHub prerelease. A resolver job
# enforces that the source package version and release tag are identical.
#
# The `release` environment's required reviewers are configured in the
# repository settings (Settings -> Environments -> release); this file only
# references the environment.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/package.json"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.0-beta.1)"
        required: true
      target:
        description: "Optional commit SHA containing that version (defaults to the selected ref)"
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.version.outputs.should-release }}
      tag: ${{ steps.version.outputs.tag }}
      target: ${{ steps.version.outputs.target }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test release automation
        run: node --test apps/desktop/scripts/*.node-test.mjs

      - name: Resolve and validate version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node apps/desktop/scripts/resolve-release-version.mjs

  linux:
    name: Build and publish Linux release
    needs: resolve
    if: needs.resolve.outputs.should-release == 'true'
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token for build provenance attestation
      attestations: write # write the attestation

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install packaging system dependencies
        run: |
          sudo apt-get update
          # librsvg2-bin rasterizes the icon master; xvfb gives the smoke
          # test a headless display. The remaining packages are Electron's
          # runtime libraries so the app can launch under xvfb — they mirror
          # the .deb's own Depends plus GPU/audio libs. libasound2 was
          # renamed libasound2t64 on Ubuntu 24.04, so try the new name first
          # and fall back for older runners.
          sudo apt-get install -y \
            librsvg2-bin xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libsecret-1-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Verify source version metadata
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages['apps/desktop'].version")"
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION"
          test "$LOCK_VERSION" = "$EXPECTED_VERSION"

      - name: Build icons
        run: bash scripts/build-icons.sh

      - name: Build workspace packages
        # Build every @otelux/* package first so the desktop renderer can
        # resolve their `dist/` exports (e.g. `@otelux/ui/workbench.css`).
        # `npm run package` only builds the desktop bundle, not its
        # workspace dependencies, so packaging fails on a clean checkout
        # without this step.
        run: npm run build

      - name: Build and package .deb
        run: npm run package -w @otelux/desktop

      - name: Checkout release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Smoke-test the packaged app
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
          OTELUX_SMOKE_REPO_ROOT: ${{ github.workspace }}
        run: xvfb-run -a node .release-automation/apps/desktop/scripts/smoke.mjs

      - name: Enforce packaged performance budgets
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
        run: xvfb-run -a node apps/desktop/scripts/perf-smoke.mjs

      - name: Generate SBOM
        run: |
          npm sbom --sbom-format cyclonedx --omit=dev -w @otelux/desktop \
            > "apps/desktop/release/otelux-${{ needs.resolve.outputs.version }}-sbom.cdx.json"

      - name: Compute checksums
        working-directory: apps/desktop/release
        run: sha256sum OTelux-*.deb otelux-*-sbom.cdx.json > SHA256SUMS

      - name: Attest build provenance
        # Build provenance attestation is only available for public
        # repositories (user-owned private repos return "Feature not
        # available"). Skip it while the repo is private; it runs
        # automatically once the repository is made public.
        # Standard provenance claims `github.sha`. Historical manual releases
        # package another immutable commit, so skip rather than attest the
        # wrong source. Future automatic version bumps satisfy this equality.
        if: ${{ !github.event.repository.private && needs.resolve.outputs.target == github.sha }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: apps/desktop/release/OTelux-*.deb

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_TARGET" \
            --jq .body > "${RUNNER_TEMP}/generated-notes.md"
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          OTelux ${{ needs.resolve.outputs.tag }} — Linux prerelease.

          ## Install (Debian/Ubuntu)

          Download the `.deb`, verify it against `SHA256SUMS`, then install:

          ```bash
          sha256sum -c SHA256SUMS
          sudo apt install ./OTelux-*.deb
          ```

          ## Supported package

          - Linux x64 `.deb`; updates are installed manually with the package manager.
          - OTLP/HTTP JSON and protobuf are supported for traces, logs, and metrics.
          - OTLP/gRPC is not supported yet.
          - Telemetry is stored locally in SQLite under the configured retention limits.

          Artifacts include the package, `SHA256SUMS`, and a CycloneDX SBOM.
          Build provenance is attested for the `.deb` when the repository and release event support it.

          ## Changes

          EOF
          cat "${RUNNER_TEMP}/generated-notes.md" >> "${RUNNER_TEMP}/release-notes.md"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .release-automation/apps/desktop/scripts/publish-github-release.mjs \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --target "${{ needs.resolve.outputs.target }}" \
            --title "OTelux ${{ needs.resolve.outputs.tag }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --asset "apps/desktop/release/OTelux-${{ needs.resolve.outputs.version }}-amd64.deb" \
            --asset "apps/desktop/release/SHA256SUMS" \
            --asset "apps/desktop/release/otelux-${{ needs.resolve.outputs.version }}-sbom.cdx.json"
