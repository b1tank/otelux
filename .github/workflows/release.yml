name: Release

# Linux release pipeline. A desktop version change on main, a matching tag,
# or a manual dispatch resolves one immutable source revision, builds native
# x64 and arm64 packages, runs unpacked and installed package smoke tests,
# generates checksums/SBOMs and provenance, then assembles one prerelease.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/desktop/package.json"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.10)"
        required: true
      target:
        description: "Optional commit SHA containing that version (defaults to the selected ref)"
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.version.outputs.should-release }}
      tag: ${{ steps.version.outputs.tag }}
      target: ${{ steps.version.outputs.target }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test release automation
        run: node --test apps/desktop/scripts/*.node-test.mjs

      - name: Resolve and validate version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node apps/desktop/scripts/resolve-release-version.mjs

  linux:
    name: Build Linux ${{ matrix.label }} release
    needs: resolve
    if: needs.resolve.outputs.should-release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: release
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}-${{ matrix.artifact }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: ubuntu-latest
            artifact: linux-x64
            performance: true
          - label: arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            performance: false

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.resolve.outputs.target }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install packaging and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            librsvg2-bin xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libsecret-1-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Verify source version metadata
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages['apps/desktop'].version")"
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION"
          test "$LOCK_VERSION" = "$EXPECTED_VERSION"

      - name: Build icons
        run: bash scripts/build-icons.sh

      - name: Build workspace packages
        run: npm run build

      - name: Build native .deb and AppImage
        run: npm run package:linux -w @otelux/desktop

      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Smoke-test unpacked application
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
          OTELUX_SMOKE_REPO_ROOT: ${{ github.workspace }}
        run: xvfb-run -a node .release-automation/apps/desktop/scripts/smoke.mjs

      - name: Install, smoke, and uninstall native packages
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
          OTELUX_SMOKE_REPO_ROOT: ${{ github.workspace }}
        run: node .release-automation/apps/desktop/scripts/install-smoke.mjs

      - name: Enforce packaged performance budgets
        if: matrix.performance
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
        run: xvfb-run -a node apps/desktop/scripts/perf-smoke.mjs

      - name: Generate platform SBOM and checksums
        run: node apps/desktop/scripts/prepare-platform-assets.mjs ${{ matrix.artifact }}

      - name: Attest build provenance
        if: ${{ !github.event.repository.private && needs.resolve.outputs.target == github.sha }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            apps/desktop/release/OTelux-*.deb
            apps/desktop/release/OTelux-*.AppImage

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelux-release-${{ matrix.artifact }}
          path: |
            apps/desktop/release/OTelux-*.deb
            apps/desktop/release/OTelux-*.AppImage
            apps/desktop/release/otelux-*-${{ matrix.artifact }}-sbom.cdx.json
            apps/desktop/release/SHA256SUMS-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Linux prerelease
    needs: [resolve, linux]
    if: needs.resolve.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download native release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: otelux-release-linux-*
          path: release-assets
          merge-multiple: true

      - name: Assemble and verify unified checksums
        run: |
          cat release-assets/SHA256SUMS-linux-* | sort > release-assets/SHA256SUMS
          (cd release-assets && sha256sum -c SHA256SUMS)
          rm release-assets/SHA256SUMS-linux-*

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_TARGET" \
            --jq .body > "${RUNNER_TEMP}/generated-notes.md"
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          OTelux ${{ needs.resolve.outputs.tag }} — Linux prerelease.

          ## Install

          Download `SHA256SUMS` plus one package for your architecture, then verify it:

          ```bash
          grep "  OTelux-.*-amd64.deb$" SHA256SUMS | sha256sum -c -
          sudo apt install ./OTelux-*-amd64.deb
          ```

          For Linux arm64, replace `amd64` with `arm64`.

          Or run the rootless AppImage without installation:

          ```bash
          grep "  OTelux-.*-x86_64.AppImage$" SHA256SUMS | sha256sum -c -
          chmod +x OTelux-*-x86_64.AppImage
          ./OTelux-*-x86_64.AppImage
          ```

          For Linux arm64, replace `x86_64` with `arm64`.

          ## Supported packages

          - Linux x64 and arm64 `.deb` and rootless AppImage; updates are installed manually.
          - OTLP/HTTP JSON and protobuf are supported for traces, logs, and metrics.
          - OTLP/gRPC is not supported yet.
          - Telemetry is stored locally in SQLite under the configured retention limits.

          Artifacts include unified `SHA256SUMS`, per-architecture CycloneDX SBOMs, and GitHub build provenance attestations.

          ## Changes

          EOF
          cat "${RUNNER_TEMP}/generated-notes.md" >> "${RUNNER_TEMP}/release-notes.md"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_ARGS=()
          while IFS= read -r -d '' asset; do
            ASSET_ARGS+=(--asset "$asset")
          done < <(find release-assets -maxdepth 1 -type f \
            \( -name 'OTelux-*.deb' -o -name 'OTelux-*.AppImage' -o -name 'otelux-*-sbom.cdx.json' -o -name 'SHA256SUMS' \) \
            -print0 | sort -z)
          node apps/desktop/scripts/publish-github-release.mjs \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --target "${{ needs.resolve.outputs.target }}" \
            --title "OTelux ${{ needs.resolve.outputs.tag }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${ASSET_ARGS[@]}"
