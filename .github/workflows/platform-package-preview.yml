name: Platform package preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/platform-package-preview.yml'
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/package.json'
      - 'apps/desktop/build/icon.svg'
      - 'apps/desktop/scripts/install-smoke.mjs'
      - 'apps/desktop/scripts/prepare-platform-assets.mjs'
      - 'apps/desktop/scripts/smoke.mjs'
      - 'apps/desktop/src/main/index.ts'
      - 'apps/desktop/src/main/windowLifecycle.ts'
      - 'scripts/build-icons.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icons:
    name: Build package icons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Build icons
        run: bash scripts/build-icons.sh

      - name: Upload icons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-icons
          path: |
            apps/desktop/build/icon.png
            apps/desktop/build/icon@1024.png
            apps/desktop/build/icons
          if-no-files-found: error
          retention-days: 3

  package:
    name: Build unsigned ${{ matrix.label }} preview
    needs: icons
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            script: package:linux
            smoke: xvfb-run -a node apps/desktop/scripts/smoke.mjs
            artifact: linux-x64
            paths: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.AppImage
              apps/desktop/release/*-linux-x64-sbom.cdx.json
              apps/desktop/release/SHA256SUMS-linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            script: package:linux
            smoke: xvfb-run -a node apps/desktop/scripts/smoke.mjs
            artifact: linux-arm64
            paths: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.AppImage
              apps/desktop/release/*-linux-arm64-sbom.cdx.json
              apps/desktop/release/SHA256SUMS-linux-arm64
          - label: macOS x64 and arm64
            runner: macos-14
            script: package:mac
            smoke: node apps/desktop/scripts/smoke.mjs
            artifact: macos-x64-arm64
            paths: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*-mac-*.zip
              apps/desktop/release/*-macos-x64-arm64-sbom.cdx.json
              apps/desktop/release/SHA256SUMS-macos-x64-arm64
          - label: Windows x64
            runner: windows-2022
            script: package:win
            smoke: node apps/desktop/scripts/smoke.mjs
            artifact: windows-x64
            paths: |
              apps/desktop/release/*.exe
              apps/desktop/release/*-windows-*.zip
              apps/desktop/release/*-windows-x64-sbom.cdx.json
              apps/desktop/release/SHA256SUMS-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libsecret-1-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Download package icons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-icons
          path: apps/desktop/build

      - name: Build workspace packages
        run: npm run build

      - name: Build unsigned package preview
        run: npm run ${{ matrix.script }} -w @otelux/desktop
        env:
          # Preview artifacts prove packaging compatibility only. Official
          # support still requires the protected signing/notarization release
          # jobs and native regression gates described in docs/sprint.plan.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SBOM and checksums
        run: node apps/desktop/scripts/prepare-platform-assets.mjs ${{ matrix.artifact }}

      - name: Smoke-test native unpacked application
        run: ${{ matrix.smoke }}
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
          OTELUX_SMOKE_REPO_ROOT: ${{ github.workspace }}

      - name: Install, smoke, and uninstall native package
        run: node apps/desktop/scripts/install-smoke.mjs
        env:
          OTELUX_SMOKE_DESKTOP_DIR: ${{ github.workspace }}/apps/desktop
          OTELUX_SMOKE_REPO_ROOT: ${{ github.workspace }}

      - name: Upload unsigned preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelux-unsigned-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 3
