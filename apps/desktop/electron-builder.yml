appId: com.otelux.desktop
productName: OTelux
executableName: otelux
copyright: Copyright © 2026 OTelux contributors
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
  # Ship only built runtime code. The app's own `out/` holds bundles, and
  # the externalized `@otelux/*` workspace packages are loaded from their
  # `dist/`. Because those workspace deps are symlinked, electron-builder
  # would otherwise copy their whole source tree, so exclude sourcemaps
  # everywhere and the workspace packages' `src/` (including tests) and
  # build config. This keeps source, tests, and maps out of the artifact.
  - "!**/*.map"
  - "!node_modules/@otelux/*/src/**"
  - "!node_modules/@otelux/*/tsconfig*.json"
  - "!node_modules/@otelux/*/tsup.config.*"
  - "!node_modules/@otelux/*/vitest.config.*"
asar: true
# App icon (master SVG: build/icon.svg). Rasterize with
# `./scripts/build-icons.sh` after editing the SVG. electron-builder picks
# up `build/icon.png` for Linux (>=512x512) and synthesizes .icns / .ico
# for macOS / Windows from the same source unless an explicit override is
# set under the platform block.
linux:
  syncDesktopName: true
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - deb
  category: Development
  maintainer: OTelux contributors
  synopsis: Local OpenTelemetry workbench.
  description: |
    OTelux is a local-first OpenTelemetry workbench. It receives traces,
    logs, and metrics from local applications and presents them through a
    fast, embeddable viewer.
  icon: build/icons
deb:
  packageName: otelux
