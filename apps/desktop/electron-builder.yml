appId: com.otelux.desktop
productName: OTelux
copyright: Copyright © 2026 OTelux contributors
directories:
  buildResources: build
  output: release
files:
  - "out/**/*"
  - "package.json"
asar: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: OTelux contributors
  synopsis: Local OpenTelemetry workbench.
  description: |
    OTelux is a local-first OpenTelemetry workbench. It receives traces,
    logs, and metrics from local applications and presents them through a
    fast, embeddable viewer.
